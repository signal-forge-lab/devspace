name: Verify Workbridge CLI lifecycle fix

on:
  pull_request:
    branches:
      - workbridge-fixed-surface
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch-and-verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Apply lifecycle fix
        shell: bash
        run: python scripts/apply-cli-lifecycle-fix.py
      - name: Install dependencies
        run: npm ci
      - name: Verify rebase contract
        run: npm run verify:rebase
      - name: Commit verified fix
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix keep CLI server alive until shutdown"
          git push origin HEAD:fix/cli-server-lifecycle-20260727
