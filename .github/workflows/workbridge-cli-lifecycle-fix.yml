name: Workbridge CLI lifecycle fix

on:
  push:
    branches:
      - fix/cli-server-lifecycle-20260727

permissions:
  contents: write

jobs:
  patch-and-verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Apply lifecycle fix and regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          cli_path = Path("src/cli.ts")
          cli = cli_path.read_text(encoding="utf-8")
          old = '''  let shuttingDown = false;
          const shutdown = async () => {
            if (shuttingDown) return;
            shuttingDown = true;
            await shutdownHttpServer(httpServer, close);
            process.exit(0);
          };
          const handleShutdown = () => {
            void shutdown().catch((error) => {
              console.error("devspace shutdown failed", error);
              process.exit(1);
            });
          };
          registerMonitorControlRoutes(app, {
            token: process.env.WORKBRIDGE_MONITOR_CONTROL_TOKEN,
            shutdown,
          });
          process.once("SIGINT", handleShutdown);
          process.once("SIGTERM", handleShutdown);
          '''
          new = '''  httpServer.ref();

          await new Promise<void>((resolveServe, rejectServe) => {
            let shuttingDown = false;
            let handleShutdown: () => void;
            const removeShutdownHandlers = () => {
              process.removeListener("SIGINT", handleShutdown);
              process.removeListener("SIGTERM", handleShutdown);
            };
            const shutdown = async () => {
              if (shuttingDown) return;
              shuttingDown = true;
              try {
                await shutdownHttpServer(httpServer, close);
                resolveServe();
              } catch (error) {
                rejectServe(error);
              } finally {
                removeShutdownHandlers();
              }
            };
            handleShutdown = () => {
              void shutdown();
            };
            registerMonitorControlRoutes(app, {
              token: process.env.WORKBRIDGE_MONITOR_CONTROL_TOKEN,
              shutdown,
            });
            process.once("SIGINT", handleShutdown);
            process.once("SIGTERM", handleShutdown);
          });
          '''
          if cli.count(old) != 1:
              raise SystemExit("expected CLI shutdown block was not found exactly once")
          cli_path.write_text(cli.replace(old, new), encoding="utf-8")

          package_path = Path("package.json")
          package = package_path.read_text(encoding="utf-8")
          build_line = '    "build": "npm run clean && tsc -p tsconfig.build.json",\n'
          test_line = '    "test:serve-lifecycle": "node scripts/cli-serve-smoke.mjs",\n'
          if package.count(build_line) != 1:
              raise SystemExit("expected build script was not found exactly once")
          package = package.replace(build_line, build_line + test_line)
          old_verify = '    "verify:rebase": "npm run typecheck && npm run lint && npm run baseline:tools:check && npm test && npm run build && git diff --check"\n'
          new_verify = '    "verify:rebase": "npm run typecheck && npm run lint && npm run baseline:tools:check && npm test && npm run build && npm run test:serve-lifecycle && git diff --check"\n'
          if package.count(old_verify) != 1:
              raise SystemExit("expected verify:rebase script was not found exactly once")
          package_path.write_text(package.replace(old_verify, new_verify), encoding="utf-8")

          smoke = r'''import assert from "node:assert/strict";
          import { spawn } from "node:child_process";
          import { mkdtempSync, mkdirSync, rmSync } from "node:fs";
          import { createServer as createNetServer } from "node:net";
          import { tmpdir } from "node:os";
          import { join, resolve } from "node:path";

          const cliPath = resolve("dist/cli.js");
          const cases = [
            { name: "default command", args: [] },
            { name: "serve command", args: ["serve"] },
          ];

          for (const testCase of cases) {
            await testServeLifecycle(testCase);
          }

          async function testServeLifecycle(testCase) {
            const root = mkdtempSync(join(tmpdir(), "workbridge-cli-serve-"));
            const configDir = join(root, ".devspace");
            const stateDir = join(root, ".state");
            const projectRoot = join(root, "project");
            const worktreeRoot = join(root, "worktrees");
            const port = await reservePort();
            const baseUrl = `http://127.0.0.1:${port}`;
            const controlToken = `test-control-token-${process.pid}-${port}`;
            mkdirSync(configDir, { recursive: true });
            mkdirSync(stateDir, { recursive: true });
            mkdirSync(projectRoot, { recursive: true });
            mkdirSync(worktreeRoot, { recursive: true });

            let stdout = "";
            let stderr = "";
            const child = spawn(process.execPath, [cliPath, ...testCase.args], {
              cwd: process.cwd(),
              env: {
                ...process.env,
                HOST: "127.0.0.1",
                PORT: String(port),
                DEVSPACE_CONFIG_DIR: configDir,
                DEVSPACE_STATE_DIR: stateDir,
                DEVSPACE_WORKTREE_ROOT: worktreeRoot,
                DEVSPACE_ALLOWED_ROOTS: projectRoot,
                DEVSPACE_ALLOWED_HOSTS: "127.0.0.1,localhost",
                DEVSPACE_PUBLIC_BASE_URL: baseUrl,
                DEVSPACE_OAUTH_OWNER_TOKEN: "test-owner-token-that-is-long-enough",
                DEVSPACE_LOG_FILE: "0",
                DEVSPACE_LOG_REQUESTS: "0",
                DEVSPACE_LOG_TOOL_CALLS: "0",
                WORKBRIDGE_MONITOR_CONTROL_TOKEN: controlToken,
              },
              stdio: ["ignore", "pipe", "pipe"],
            });
            child.stdout.setEncoding("utf8");
            child.stderr.setEncoding("utf8");
            child.stdout.on("data", (chunk) => {
              stdout += chunk;
            });
            child.stderr.on("data", (chunk) => {
              stderr += chunk;
            });

            try {
              const health = await waitForHealth(child, `${baseUrl}/healthz`, () => ({ stdout, stderr }));
              assert.equal(health.ok, true, `${testCase.name}: /healthz must report ok`);
              await delay(300);
              assert.equal(
                child.exitCode,
                null,
                `${testCase.name}: CLI exited after startup\n${formatOutput(stdout, stderr)}`,
              );

              const shutdownResponse = await fetch(`${baseUrl}/monitor/api/control/shutdown`, {
                method: "POST",
                headers: { authorization: `Bearer ${controlToken}` },
              });
              assert.equal(shutdownResponse.status, 202, `${testCase.name}: shutdown must be accepted`);

              const result = await waitForExit(child, 15_000);
              assert.equal(result.signal, null, `${testCase.name}: shutdown must not require termination`);
              assert.equal(
                result.code,
                0,
                `${testCase.name}: shutdown must exit successfully\n${formatOutput(stdout, stderr)}`,
              );
              assert.match(stdout, /Workbridge listening/, `${testCase.name}: startup log must be emitted`);
            } finally {
              if (child.exitCode === null && child.signalCode === null) {
                child.kill();
                await waitForExit(child, 5_000).catch(() => undefined);
              }
              rmSync(root, { recursive: true, force: true });
            }
          }

          async function reservePort() {
            const server = createNetServer();
            await new Promise((resolveListen, rejectListen) => {
              server.once("error", rejectListen);
              server.listen(0, "127.0.0.1", resolveListen);
            });
            const address = server.address();
            assert.ok(address && typeof address === "object");
            await new Promise((resolveClose, rejectClose) => {
              server.close((error) => error ? rejectClose(error) : resolveClose());
            });
            return address.port;
          }

          async function waitForHealth(child, url, output) {
            const deadline = Date.now() + 20_000;
            while (Date.now() < deadline) {
              if (child.exitCode !== null || child.signalCode !== null) {
                const current = output();
                throw new Error(`CLI exited before /healthz became ready\n${formatOutput(current.stdout, current.stderr)}`);
              }
              try {
                const response = await fetch(url, { signal: AbortSignal.timeout(1_000) });
                if (response.status === 200) return await response.json();
              } catch {
                // The child may still be binding the port.
              }
              await delay(100);
            }
            const current = output();
            throw new Error(`Timed out waiting for ${url}\n${formatOutput(current.stdout, current.stderr)}`);
          }

          function waitForExit(child, timeoutMs) {
            if (child.exitCode !== null || child.signalCode !== null) {
              return Promise.resolve({ code: child.exitCode, signal: child.signalCode });
            }
            return new Promise((resolveExit, rejectExit) => {
              const timeout = setTimeout(() => {
                cleanup();
                rejectExit(new Error(`Timed out waiting for child process ${child.pid} to exit`));
              }, timeoutMs);
              const onExit = (code, signal) => {
                cleanup();
                resolveExit({ code, signal });
              };
              const cleanup = () => {
                clearTimeout(timeout);
                child.removeListener("exit", onExit);
              };
              child.once("exit", onExit);
            });
          }

          function formatOutput(stdout, stderr) {
            return `stdout:\n${stdout || "<empty>"}\nstderr:\n${stderr || "<empty>"}`;
          }

          function delay(ms) {
            return new Promise((resolveDelay) => setTimeout(resolveDelay, ms));
          }
          '''
          smoke = "\n".join(line[10:] if line.startswith("          ") else line for line in smoke.splitlines()) + "\n"
          Path("scripts/cli-serve-smoke.mjs").write_text(smoke, encoding="utf-8")
          Path(".github/workflows/workbridge-cli-lifecycle-fix.yml").unlink()
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify rebase contract
        run: npm run verify:rebase
      - name: Commit verified fix
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cli.ts package.json scripts/cli-serve-smoke.mjs .github/workflows/workbridge-cli-lifecycle-fix.yml
          git commit -m "fix keep CLI server alive until shutdown"
          git push origin HEAD:fix/cli-server-lifecycle-20260727
