name: Verify Workbridge CLI lifecycle on Windows

on:
  pull_request:
    branches:
      - workbridge-fixed-surface
    types:
      - synchronize

permissions:
  contents: read

jobs:
  windows-cli-lifecycle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:serve-lifecycle
