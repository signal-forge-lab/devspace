<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workbridge Monitor</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
    main { width: min(520px, calc(100vw - 48px)); padding: 32px; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 16px; }
    h1 { margin: 0 0 12px; font-size: 28px; line-height: 1.2; }
    p { margin: 0; line-height: 1.6; opacity: .78; }
    .actions { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
    button { min-height: 44px; padding: 0 18px; border-radius: 9px; border: 1px solid currentColor; font: inherit; font-weight: 650; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .55; }
    button.secondary { background: transparent; color: inherit; }
    #status { min-height: 24px; margin-top: 18px; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Workbridge is stopped</h1>
    <p>Monitor server に接続できません。Workbridge を起動するか、すでに起動済みなら再接続してください。</p>
    <div class="actions">
      <button id="start" type="button">Start Workbridge</button>
      <button id="retry" class="secondary" type="button">Retry</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const host = window.workbridgeMonitorHost;
    const start = document.querySelector('#start');
    const retry = document.querySelector('#retry');
    const status = document.querySelector('#status');
    const openMonitor = () => location.replace(host.monitorUrl);
    const setBusy = (busy) => { start.disabled = busy; retry.disabled = busy; };

    retry.addEventListener('click', async () => {
      setBusy(true);
      status.textContent = 'Checking Workbridge...';
      try {
        if (await host.api.isReachable()) openMonitor();
        else status.textContent = 'Workbridge is still unavailable.';
      } catch (error) {
        status.textContent = error?.message || String(error);
      } finally {
        setBusy(false);
      }
    });
    start.addEventListener('click', async () => {
      setBusy(true);
      status.textContent = 'Starting Workbridge...';
      try {
        await host.api.runAction('start');
        status.textContent = 'Workbridge started. Opening Monitor...';
        openMonitor();
      } catch (error) {
        status.textContent = error?.message || String(error);
        setBusy(false);
      }
    });
  </script>
</body>
</html>
